name: Build and Push Docker Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - Rewrite
      - dev

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Check out the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Log in to GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Set Docker tags (image name must be lowercase)
      - name: Set Docker tags
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          case "${GITHUB_REF}" in
            refs/heads/main)
              TAGS="${IMAGE}:latest"
              ;;
            refs/heads/Rewrite)
              TAGS="${IMAGE}:rewrite"
              ;;
            refs/heads/dev)
              TAGS="${IMAGE}:nightly,${IMAGE}:nightly-$(date -u +%Y%m%d-%H%M%S)"
              ;;
            *)
              # Manual run from any other branch: tag by sanitized branch name
              BRANCH=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]/' '[:lower:]-')
              TAGS="${IMAGE}:${BRANCH}"
              ;;
          esac
          echo "DOCKER_TAGS=${TAGS}" >> "$GITHUB_ENV"

      # Step 4: Set up QEMU and Buildx for multi-arch builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 5: Build from this repo and push to GHCR
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_TAGS }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          platforms: ${{ env.PLATFORMS }}
